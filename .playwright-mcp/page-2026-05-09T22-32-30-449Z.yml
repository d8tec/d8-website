          - generic [ref=e90]:
            - paragraph [ref=e91]: No es un wrapper sobre un modelo existente. Pipelines de inferencia reales, despliegue en el edge y sistemas de datos construidos para las preguntas que realmente necesitas responder. Entrenamos, desplegamos y mantenemos modelos útiles con el tiempo.
            - list [ref=e92]:
