              - listitem [ref=e42]:
                - generic [ref=e44]: Prototipado embebido y mecánico
              - listitem [ref=e45]:
                - generic [ref=e47]: Validación en campo e instrumentación de pruebas
              - listitem [ref=e48]:
                - generic [ref=e50]: Transferencia de investigación a producción
        - generic [ref=e51]:
          - generic [ref=e52]: "02"
          - heading "Hardware & Software" [level=2] [ref=e53]
          - generic [ref=e54]:
            - paragraph [ref=e55]: La mayoría de los proveedores hacen un lado. D8 hace ambos, en un equipo, sin el costo de integración. Del PCB al dashboard en la nube, somos dueños del stack completo hardware-software y eliminamos las brechas entre capas.
            - list [ref=e56]:
              - listitem [ref=e57]:
                - generic [ref=e59]: Desarrollo de firmware para ESP32, STM32 y entornos RTOS
              - listitem [ref=e60]:
                - generic [ref=e62]: Diseño de PCB, puesta en marcha de tarjetas y transferencia a manufactura
              - listitem [ref=e63]:
                - generic [ref=e65]: Conectividad en la nube, gestión de dispositivos y datos en tiempo real
              - listitem [ref=e66]:
                - generic [ref=e68]: Dashboards full-stack e interfaces operacionales
        - generic [ref=e69]:
          - generic [ref=e70]: "03"
          - heading "Web & App" [level=2] [ref=e71]
          - generic [ref=e72]:
            - paragraph [ref=e73]: Plataformas que operan, no solo muestran. Agendamiento, facturación, datos multi-tenant, los sistemas que hacen funcionar un negocio día a día. Construidas para escalar y mantenidas por un equipo que entiende la arquitectura.
            - list [ref=e74]:
              - listitem [ref=e75]:
                - generic [ref=e77]: Aplicaciones web y plataformas SaaS multi-tenant
              - listitem [ref=e78]:
                - generic [ref=e80]: Control de acceso por rol, facturación y flujos operacionales
              - listitem [ref=e81]:
                - generic [ref=e83]: Diseño de API, integraciones y arquitectura de servicios
              - listitem [ref=e84]:
                - generic [ref=e86]: Aplicaciones móviles y progressive web apps
        - generic [ref=e87]:
