          - heading "R&D" [level=2] [ref=e35]
          - generic [ref=e36]:
            - paragraph [ref=e37]: Vamos primero. Cuando el problema no está definido o la tecnología para resolverlo aún no existe, construimos la evidencia que permite tomar la siguiente decisión. D8 asume trabajo ambiguo y entrega algo sobre lo que puedes construir.
            - list [ref=e38]:
