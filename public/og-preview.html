<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #080808;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .stripe { width: 100%; height: 4px; background: #9900ff; flex-shrink: 0; }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 80px;
    }
    .domain {
      display: flex;
      justify-content: flex-end;
      color: #555555;
      font-size: 18px;
      letter-spacing: 0.08em;
    }
    .line1 {
      font-size: 96px;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.05;
      letter-spacing: -0.025em;
    }
    .line2 {
      font-size: 96px;
      font-weight: 700;
      color: #b84dff;
      line-height: 1.05;
      letter-spacing: -0.025em;
      margin-bottom: 48px;
    }
    .tags {
      font-size: 18px;
      color: #555555;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <div class="content">
    <div class="domain">d8tec.com</div>
    <div>
      <div class="line1">Engineering &amp;</div>
      <div class="line2">Development.</div>
      <div class="tags">R&amp;D &nbsp;·&nbsp; HARDWARE / SOFTWARE &nbsp;·&nbsp; WEB &amp; APP &nbsp;·&nbsp; AI</div>
    </div>
  </div>
</body>
</html>
